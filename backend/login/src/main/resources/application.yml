spring:
    application:
       name: login
    logging:
        level:
            root: DEBUG
    server:
        port: ${SERVER_PORT:8080}
        shutdown: immediate
    datasource:
        url:
        password:
        username:
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    flyway:
        enabled: true
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT:6379}
    session:
        store-type: redis
        timeout: 30m

    management:
        endpoints:
            web:
                exposure:
                    include: health,info
        endpoint:
            health:
                probes:
                    enabled: true
            