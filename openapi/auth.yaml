openapi : 3.1.0

info:
  title: Secure Login API 
  version: 1.0.0

paths:

  /api/v1/auth/login:
    post:
      summary: Authenticated user
      responses:
        "204":
          description: Authenticated success
        "401":
          description: Authenticated fail
        "429":
          description: Too many attempts
  /api/v1/auth/me:
    get:
      summary: return currrent user
      responses:
        "204":
          description: Authenticated success
        "401":
          description: Authentication required
